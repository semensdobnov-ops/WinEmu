name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download UEFI firmware
        run: |
          sudo apt-get update
          apt-get download qemu-efi-aarch64
          dpkg -x qemu-efi-aarch64*.deb efi
          mkdir -p app/src/main/assets
          cp efi/usr/share/qemu-efi-aarch64/QEMU_EFI.fd app/src/main/assets/edk2-aarch64-code.fd
          truncate -s 64M app/src/main/assets/edk2-aarch64-code.fd

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WinEmu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
